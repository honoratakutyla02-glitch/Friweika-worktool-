<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Friweika WorkTool 2.0</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <img class="logo" src="assets/friweika-potato.png" alt="logo">
  <h1>Friweika WorkTool</h1>
  <button id="menuBtn" class="menu-btn">⚙️</button>
</header>
<div class="header-sep"></div>

<div class="container">

  <!-- TRANSLATOR -->
  <div class="card" id="translateCard">
    <label>Język źródłowy:</label>
    <select id="langFrom">
      <option value="pl">Polski</option>
      <option value="de">Niemiecki</option>
      <option value="en">Angielski</option>
      <option value="uk">Ukraiński</option>
      <option value="ar">Arabski</option>
    </select>

    <label style="margin-top:10px">Język docelowy:</label>
    <select id="langTo">
      <option value="de">Niemiecki</option>
      <option value="pl">Polski</option>
      <option value="en">Angielski</option>
      <option value="uk">Ukraiński</option>
      <option value="ar">Arabski</option>
    </select>

    <label style="margin-top:10px">Tekst do tłumaczenia:</label>
    <textarea id="sourceText" placeholder="Wpisz tekst..."></textarea>

    <div class="controls">
      <button id="translateBtn" class="btn btn-primary">Tłumacz</button>
      <button id="googleBtn" class="btn btn-ghost">🌐</button>
      <button id="micBtn" class="btn btn-ghost">🎤</button>
      <button id="imgBtn" class="btn btn-ghost">📷</button>
    </div>

    <label style="margin-top:12px">Tłumaczenie:</label>
    <textarea id="translatedText" readonly></textarea>
  </div>

  <!-- HISTORY -->
  <div class="card" id="historyCard" style="display:none;margin-top:18px;">
    <h3>Historia tłumaczeń + analiza</h3>

    <button id="legendToggle" class="btn-ghost" style="margin-top:6px">Legenda</button>

    <div id="legendArea" class="legend" style="display:none;margin-top:10px;">
      <div class="legend-row"><div class="color-box der"></div> der</div>
      <div class="legend-row"><div class="color-box die"></div> die</div>
      <div class="legend-row"><div class="color-box das"></div> das</div>
      <div class="legend-row"><div class="color-box noun"></div> Rzeczownik</div>
      <div class="legend-row"><div class="color-box verb"></div> Czasownik</div>
      <div class="legend-row"><div class="color-box adj"></div> Przymiotnik</div>
      <div class="legend-row"><div class="color-box adv"></div> Przysłówek</div>
      <div class="legend-row"><div class="color-box prep"></div> Przyimek</div>
    </div>

    <div id="historyList" style="margin-top:14px"></div>
    <button id="clearHistoryBtn" class="btn-ghost" style="margin-top:10px;">Wyczyść historię</button>
  </div>

  <!-- LEARN -->
  <div class="card" id="learnCard" style="display:none;margin-top:18px;">
    <h3>Nauka</h3>

    <div id="flashcardsArea" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:12px"></div>

    <h3 style="margin-top:20px;">Czasowniki nieregularne</h3>
    <div id="irrArea"></div>
  </div>

</div>

<footer class="footer">
  <img src="assets/friweika-logo.png" />
  <div class="note">Wersja testowa Friweika — 2.0</div>
</footer>

<div class="nav">
  <div class="item active" data-tab="translate">💬 Tłumacz</div>
  <div class="item" data-tab="history">🕘 Historia</div>
  <div class="item" data-tab="learn">🧠 Nauka</div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel" class="settings-panel card">
  <h3>Ustawienia</h3>

  <label>Tryb ciemny:</label>
  <input type="checkbox" id="toggleDarkMode">

  <label style="margin-top:10px">Kolorowanie tekstu:</label>
  <input type="checkbox" id="toggleColoring" checked>

  <button id="closeSettings" class="btn-ghost" style="margin-top:14px">Zamknij</button>
</div>

<script src="app.js"></script>
</body>
</html>
