<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Friweika WorkTool — Prototype</title>

<style>

/* ======== KOLORY (B1 – mocniejsze, firmowe) ======== */
:root{
  --fri-yellow:#FBD345;
  --fri-red:#C52626;
  --fri-orange:#F4741B;
  --fri-bg:#FFF3D2;
  --text-dark:#3A2A2A;

  --tag-n-bg:#d3ecff;
  --tag-n-txt:#003a73;

  --tag-v-bg:#ffd6e3;
  --tag-v-txt:#a90026;

  --tag-a-bg:#dbffdc;
  --tag-a-txt:#0e5c15;
}

/* ======== RESET ======== */
*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--fri-bg);
  font-family:Segoe UI, Roboto, Arial, sans-serif;
  color:var(--text-dark);
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
}

/* ======== TŁO (budynek — blur) ======== */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url('assets/friweika-bg.jpg') center/cover no-repeat;
  filter:blur(10px) brightness(0.88);
  z-index:-2;
}

/* warstwa czytelności */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.55);
  z-index:-1;
}

/* ======== HEADER ======== */
header{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(8px);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:4px solid var(--fri-yellow);
}
header img{
  height:58px;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,0.25));
}
header h1{
  color:var(--fri-red);
  margin:0;
  font-size:22px;
  font-weight:900;
}

/* ======== CONTAINER ======== */
.container{
  max-width:900px;
  margin:18px auto;
  padding:16px;
}

/* ======== CARD ======== */
.card{
  background:rgba(255,255,255,0.88);
  backdrop-filter:blur(5px);
  padding:16px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

/* ======== FORM ======== */
label{
  display:block;
  margin:.6rem 0;
  color:var(--fri-red);
  font-weight:700;
}
select,textarea,input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #d9d9d9;
  font-size:15px;
}
textarea{ min-height:110px; }

/* ======== BUTTONS ======== */
.controls{
  display:flex;
  gap:12px;
  margin-top:14px;
}
.btn{
  padding:12px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:700;
}
.btn-primary{
  background:var(--fri-red);
  color:#fff;
}
.btn-ghost{
  background:#eee;
}

/* ======== NAV ======== */
.nav{
  position:fixed;
  left:0; right:0;
  bottom:0;
  height:72px;
  background:#fff;
  border-top:3px solid var(--fri-yellow);
  display:flex;
}
.nav .item{
  flex:1;
  text-align:center;
  padding:8px;
  color:#666;
  cursor:pointer;
  font-size:14px;
}
.nav .item.active{
  color:var(--fri-red);
  font-weight:700;
}

/* ===== HISTORIA ===== */
.history-item{
  background:#fff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}
.small{ font-size:13px; color:#666; margin-top:8px; }

/* ===== LEGEND ===== */
.legend{
  margin-top:12px;
  padding:12px;
  background:#fff4c6;
  border-radius:10px;
  font-size:14px;
  border:2px solid var(--fri-yellow);
}
.legend div{ margin:4px 0; }

/* ===== TAGI części mowy ===== */
.parts{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:8px;
}
.tag{
  padding:6px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
}
.tag.n{ background:var(--tag-n-bg); color:var(--tag-n-txt); }
.tag.v{ background:var(--tag-v-bg); color:var(--tag-v-txt); }
.tag.a{ background:var(--tag-a-bg); color:var(--tag-a-txt); }

/* ===== FOOTER ===== */
.footer-logo{
  margin-top:60px;
  text-align:center;
}
.footer-logo img{
  width:180px;
  opacity:0.95;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,0.25));
}

.footer-note{
  text-align:center;
  padding:12px;
  color:#444;
  font-size:14px;
}

</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <img src="assets/friweika-potato.png" alt="Friweika potato logo">
  <h1>Friweika WorkTool — Prototype</h1>
</header>

<div class="container">

  <!-- ===== TŁUMACZ ===== -->
  <div class="card" id="translateCard">

    <label>Język źródłowy (source):</label>
    <select id="langFrom">
      <option value="pl">Polski</option>
      <option value="de">Niemiecki</option>
      <option value="en">Angielski</option>
    </select>

    <label>Język docelowy (target):</label>
    <select id="langTo">
      <option value="de">Niemiecki</option>
      <option value="pl">Polski</option>
      <option value="en">Angielski</option>
    </select>

    <label>Tekst do tłumaczenia:</label>
    <textarea id="sourceText" placeholder="Wpisz tekst..."></textarea>

    <div class="controls">
      <button class="btn btn-primary" id="translateBtn">Tłumacz</button>
      <button class="btn btn-ghost" id="googleBtn">🌐</button>
      <button class="btn btn-ghost" id="micBtn">🎤</button>
      <button class="btn btn-ghost" id="imgBtn">📷</button>
    </div>

    <div class="result">
      <label>Tłumaczenie:</label>
      <textarea id="translatedText" readonly placeholder="Tutaj pojawi się wynik..."></textarea>
      <div class="small" id="debugNote"></div>
    </div>

    <!-- ===== ANALIZA ===== -->
    <div style="margin-top:14px">
      <label>Analiza językowa:</label>
      <div id="analysis" class="parts"></div>

      <div class="legend">
        <div><span class="tag n">słowo</span> — rzeczownik</div>
        <div><span class="tag v">słowo</span> — czasownik</div>
        <div><span class="tag a">słowo</span> — przymiotnik / inne</div>
      </div>
    </div>

  </div>

  <div style="height:14px"></div>

  <!-- ===== HISTORIA ===== -->
  <div class="card" id="historyCard">
    <h3>Historia tłumaczeń</h3>
    <div id="historyList"></div>
  </div>

  <div style="height:80px"></div>
</div>

<!-- STOPKA -->
<div class="footer-logo">
  <img src="assets/friweika-logo.png" alt="Friweika logo clean">
</div>

<div class="footer-note">Wersja testowa Friweika — Prototype</div>

<!-- ===== SCRIPT ===== -->
<script>

// NAV
const navItems=document.querySelectorAll('.nav .item');
const translateCard=document.getElementById('translateCard');
const historyCard=document.getElementById('historyCard');
navItems.forEach(it=>it.addEventListener('click',()=>{
  navItems.forEach(x=>x.classList.remove('active'));
  it.classList.add('active');
  const tab=it.dataset.tab;
  translateCard.style.display = tab==='translate'?'block':'none';
  historyCard.style.display = tab==='history'?'block':'none';
  if(tab==='history') renderHistory();
}));

translateCard.style.display='block';
historyCard.style.display='none';

// DEBUG
function setDebug(t){ document.getElementById('debugNote').textContent=t||''; }

// ================= TRANSLACJA ==================
document.getElementById('translateBtn').addEventListener('click',async()=>{
  const q=document.getElementById('sourceText').value.trim();
  const source=document.getElementById('langFrom').value;
  const target=document.getElementById('langTo').value;
  const out=document.getElementById('translatedText');
  if(!q){ alert('Wpisz tekst.'); return; }

  out.value='Tłumaczę...'; setDebug('');

  try{
    const res=await fetch('/api/translate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q,source,target})
    });
    const j=await res.json();
    if(j.ok && j.translation){
      out.value=j.translation;
      saveHistory(q,j.translation);
      renderAnalysis(j.translation);
    } else {
      out.value='Błąd tłumaczenia.';
      setDebug(JSON.stringify(j));
    }
  }catch(e){
    out.value='Błąd połączenia z serwerem.';
    setDebug(e.message);
  }
});

// Google
document.getElementById('googleBtn').addEventListener('click',()=>{
  const txt=encodeURIComponent(document.getElementById('sourceText').value);
  window.open(
    'https://translate.google.com/?sl=auto&tl='+
    document.getElementById('langTo').value+
    '&text='+txt,
    '_blank'
  );
});

// Mikrofon
let recognition;
if('webkitSpeechRecognition'in window||'SpeechRecognition'in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='pl-PL';
  recognition.interimResults=false;
  recognition.onresult=e=>{
    const t=[...e.results].map(r=>r[0].transcript).join('');
    document.getElementById('sourceText').value=t;
  };
}
document.getElementById('micBtn').addEventListener('click',()=>{
  if(!recognition){ alert('Brak wsparcia mikrofonu.'); return; }
  recognition.start();
});

// Zdjęcia (placeholder)
document.getElementById('imgBtn').addEventListener('click',()=>{
  alert('OCR dojdzie później :)');
});

// ================= HISTORIA =================
function saveHistory(i,o){
  const list=JSON.parse(localStorage.getItem('fri_history')||'[]');
  list.unshift({i,o,date:new Date().toLocaleString()});
  localStorage.setItem('fri_history',JSON.stringify(list));
}
function renderHistory(){
  const list=JSON.parse(localStorage.getItem('fri_history')||'[]');
  const box=document.getElementById('historyList');
  box.innerHTML='';
  if(!list.length){ box.innerHTML='<p>Brak historii.</p>'; return; }
  list.forEach(it=>{
    const el=document.createElement('div');
    el.className='history-item';
    el.innerHTML=
      `<div style="font-size:13px;font-weight:700">${it.date}</div>
       <div><b>Wejście:</b> ${it.i}</div>
       <div><b>Wyjście:</b> ${it.o}</div>`;
    box.appendChild(el);
  });
}

// ======= ANALIZA SŁÓW =======
function renderAnalysis(t){
  const out=document.getElementById('analysis');
  out.innerHTML='';
  if(!t) return;
  const words=t.split(/[\s,.;!?]+/).filter(w=>w.length>1);
  words.forEach(w=>{
    const cls=detectPOS(w);
    const el=document.createElement('span');
    el.className='tag '+cls;
    el.textContent=w;
    out.appendChild(el);
  });
}
function detectPOS(w){
  const lw=w.toLowerCase();
  if(/[0-9]/.test(lw)) return 'n';
  if(lw.endsWith('ć')||lw.endsWith('ed')||lw.endsWith('en')||lw.endsWith('ing')) return 'v';
  if(lw.endsWith('y')||lw.endsWith('a')||lw.endsWith('e')||lw.endsWith('o')) return 'n';
  return 'a';
}

</script>
</body>
</html>
