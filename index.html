<!-- Friweika WorkTool Prototype: With history + contacts + improved UI -->
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Friweika WorkTool</title>
<style>
  :root { --yellow:#ffd84c; --red:#c92a2a; --bg:#fff9e6; --text:#3b2f2f; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family: "Segoe UI", Roboto, Arial, sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(90deg,var(--red),#ff7043);color:#fff;text-align:center;padding:14px;font-size:20px;font-weight:700}

  /* bottom navigation */
  .nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;border-top:2px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
  .nav button{background:none;border:none;font-size:14px;color:#444;flex:1;cursor:pointer;padding:6px 0}
  .nav button.active{color:var(--red);font-weight:700}

  /* pages */
  .page{display:none;padding:16px 12px 70px 12px;max-width:760px;margin:auto}
  .page.active{display:block}

  label{display:block;margin-top:12px;font-weight:700;color:var(--red)}
  select,textarea,input{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:5px;font-size:15px}
  textarea{resize:vertical;min-height:100px}
  .btn{background:var(--red);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;margin-top:12px;cursor:pointer;width:100%}
  .btn-secondary{background:#eee;color:#333;border:none;padding:10px;margin-top:10px;border-radius:8px;cursor:pointer;width:100%}

  .history-item{background:#fff;padding:12px;border-radius:8px;margin-top:10px;border:1px solid #ddd;cursor:pointer}
  .history-item p{font-size:14px;margin-bottom:4px}

  .contact-box{background:#fff;padding:14px;border-radius:10px;margin-top:12px;border:1px solid #ddd}
  .contact-box h3{margin-bottom:6px;color:var(--red)}
  .contact-box a{display:inline-block;margin-top:6px;font-weight:700;color:#0073ff;text-decoration:none}
</style>
</head>
<body>
<header>Friweika WorkTool</header>

<!-- NAVIGATION -->
<div class="nav">
  <button id="tab-translate" class="active" onclick="switchTab('translate')">Tłumacz</button>
  <button id="tab-history" onclick="switchTab('history')">Historia</button>
  <button id="tab-contacts" onclick="switchTab('contacts')">Kontakty</button>
</div>

<!-- PAGE: TRANSLATOR -->
<div id="translate" class="page active">
  <label for="langFrom">Język źródłowy (source):</label>
  <select id="langFrom">
    <option value="pl">Polski</option>
    <option value="de">Niemiecki</option>
    <option value="en">Angielski</option>
    <option value="uk">Ukraiński</option>
    <option value="ar">Arabski</option>
  </select>

  <label for="langTo">Język docelowy (target):</label>
  <select id="langTo">
    <option value="de">Niemiecki</option>
    <option value="pl">Polski</option>
    <option value="en">Angielski</option>
    <option value="uk">Ukraiński</option>
    <option value="ar">Arabski</option>
  </select>

  <label for="sourceText">Tekst do tłumaczenia:</label>
  <textarea id="sourceText" placeholder="Wpisz tutaj tekst..."></textarea>

  <button class="btn" onclick="translateText()">Tłumacz</button>
  <button class="btn-secondary" onclick="openGoogleTranslate()">Otwórz Google Translate</button>

  <label for="translatedText" style="margin-top:16px">Tłumaczenie:</label>
  <textarea id="translatedText" readonly placeholder="Tutaj pojawi się wynik..."></textarea>

  <p id="debugNote" style="margin-top:6px;font-size:13px;color:#666"></p>
</div>

<!-- PAGE: HISTORY -->
<div id="history" class="page">
  <h2 style="color:var(--red);margin-bottom:10px">Historia tłumaczeń</h2>
  <div id="historyList"></div>
  <button class="btn-secondary" onclick="clearHistory()">Wyczyść historię</button>
</div>

<!-- PAGE: CONTACTS -->
<div id="contacts" class="page">
  <h2 style="color:var(--red);margin-bottom:10px">Kontakty firmowe</h2>

  <div class="contact-box">
    <h3>Kierownik zmiany A</h3>
    <p>Numer: 111 111 111</p>
    <a href="tel:111111111">Zadzwoń</a>
  </div>

  <div class="contact-box">
    <h3>Kierownik zmiany B</h3>
    <p>Numer: 222 222 222</p>
    <a href="tel:222222222">Zadzwoń</a>
  </div>

  <div class="contact-box">
    <h3>Biuro / Szef produkcji</h3>
    <p>Numer: 333 333 333</p>
    <a href="tel:333333333">Zadzwoń</a>
  </div>
</div>

<script>
/* ------------------- NAVIGATION ------------------- */
function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab === 'history') loadHistory();
}

/* ------------------- TRANSLATION ------------------- */
const PRIMARY_ENDPOINT = "/api/translate";

function setDebug(t){ document.getElementById('debugNote').textContent = t || ""; }

async function translateText(){
  const src = document.getElementById('sourceText').value.trim();
  const from = document.getElementById('langFrom').value;
  const to = document.getElementById('langTo').value;
  const output = document.getElementById('translatedText');

  if(!src){ alert("Wpisz tekst."); return; }

  output.value = "Tłumaczę...";
  setDebug("");

  try{
    const r1 = await fetch(PRIMARY_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q:src, source:from, target:"en"})
    });

    const j1 = await r1.json();
    const eng = j1.translation || "";

    const r2 = await fetch(PRIMARY_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q:eng, source:"en", target:to})
    });

    const j2 = await r2.json();
    const final = j2.translation || "[Brak rezultatu]";

    output.value = final;
    saveHistory(src, final, from, to);

  } catch(e){
    output.value = "Błąd połączenia z serwerem.";
    setDebug(e.message || e);
  }
}

function openGoogleTranslate(){
  const src = encodeURIComponent(document.getElementById('sourceText').value || "");
  const from = document.getElementById('langFrom').value;
  const to = document.getElementById('langTo').value;

  const url = `https://translate.google.com/?sl=${from}&tl=${to}&text=${src}&op=translate`;
  window.open(url, "_blank");
}

/* ------------------- HISTORY ------------------- */
function saveHistory(src, result, from, to){
  const entry = {src, result, from, to, time:Date.now()};
  const history = JSON.parse(localStorage.getItem('fw_history') || '[]');
  history.unshift(entry);
  localStorage.setItem('fw_history', JSON.stringify(history));
}

function loadHistory(){
  const box = document.getElementById('historyList');
  box.innerHTML = "";
  const history = JSON.parse(localStorage.getItem('fw_history') || '[]');

  if(history.length === 0){
    box.innerHTML = '<p style="margin-top:10px;color:#666">Brak historii.</p>';
    return;
  }

  history.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `<p><b>${item.from} → ${item.to}</b></p><p>${item.src}</p><p style="color:var(--red)">${item.result}</p>`;
    div.onclick = ()=>{
      document.getElementById('sourceText').value = item.src;
      document.getElementById('translatedText').value = item.result;
      document.getElementById('langFrom').value = item.from;
      document.getElementById('langTo').value = item.to;
      switchTab('translate');
    };
    box.appendChild(div);
  });
}

function clearHistory(){
  localStorage.removeItem('fw_history');
  loadHistory();
}
</script>

</body>
</html>
