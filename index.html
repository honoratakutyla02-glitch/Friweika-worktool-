<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Friweika WorkTool — Prototype</title>

<!-- NOWY INDEX: ŁĄCZY TWÓJ LAYOUT + KOLOROWANIE + HISTORIA + RODZAJNIKI -->

<style>
/* ======== KOLORY FIRMOWE ======== */
:root{
  --fri-yellow:#FBD345;
  --fri-red:#C52828;
  --fri-orange:#F76C1F;
  --fri-bg:#FFF4D6;
  --text-dark:#3A2A2A;

  --fri-red-dark:#9e1c1c;

  /* ====== KOLORY ANALIZY (NOWE) ====== */
  --det-der:#FF3B30;
  --det-die:#00C851;
  --det-das:#007BFF;

  --noun:#007BFF;
  --verb:#00C851;
  --adj:#FFEB3B;
  --adv:#AF52DE;
  --prep:#FF9500;
}

/* ======== RESET ======== */
*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--fri-bg);
  font-family:Segoe UI, Roboto, Arial, sans-serif;
  color:var(--text-dark);
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
}

/* ======== TŁO ======== */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url('assets/friweika-bg.jpg') center/cover no-repeat;
  filter:blur(12px) brightness(0.9);
  z-index:-2;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.55);
  z-index:-1;
}

/* ======== HEADER ======== */
header{
  background:var(--fri-red);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:14px;
}
header img{ height:60px; }
header h1{
  color:white;
  margin:0;
  font-size:22px;
  font-weight:900;
}

/* ======== STRUKTURA ======== */
.container{
  max-width:900px;
  margin:18px auto;
  padding:16px;
}
.card{
  background:#fff;
  padding:16px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

/* ======== FORM ======== */
label{
  display:block;
  margin:.6rem 0;
  color:var(--fri-red);
  font-weight:700;
}
select,textarea,input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #d9d9d9;
  font-size:15px;
}
textarea{ min-height:110px; }

/* ======== BUTTONY ======== */
.controls{
  display:flex;
  gap:12px;
  margin-top:14px;
}
.btn{
  padding:12px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:700;
}
.btn-primary{
  background:var(--fri-red);
  color:#fff;
}
.btn-ghost{
  background:#f9f9f9;
  border:1px solid #ccc;
}

/* ===== NAWIGACJA ===== */
.nav{
  position:fixed;
  left:0; right:0;
  bottom:0;
  height:72px;
  background:#fff;
  border-top:4px solid var(--fri-yellow);
  display:flex;
  z-index:20;
}
.nav .item{
  flex:1;
  text-align:center;
  padding:8px;
  color:#666;
  cursor:pointer;
  font-size:14px;
}
.nav .item.active{
  color:var(--fri-red);
  font-weight:700;
}

/* ===== HISTORIA ===== */
.history-item{
  background:#fff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}
.small{ font-size:13px; color:#666; margin-top:8px; }

/* ===== LEGENDA (NOWA) ===== */
.legend{
  margin-top:12px;
  padding:10px;
  background:#fff8dd;
  border-radius:10px;
  font-size:14px;
}
.legend-row{ display:flex; gap:10px; align-items:center; }
.color-box{
  width:16px;
  height:16px;
  border-radius:4px;
}

/* ===== TOKENS ===== */
.tok{ font-weight:700; }
.det-der{ color:var(--det-der); }
.det-die{ color:var(--det-die); }
.det-das{ color:var(--det-das); }

.noun{ color:var(--noun); }
.verb{ color:var(--verb); }
.adj{ color:var(--adj); }
.adv{ color:var(--adv); }
.prep{ color:var(--prep); }

/* Dla history */
.hist-colored{ margin-top:8px; }

</style>
</head>

<body>

<header>
  <img src="assets/friweika-potato.png" />
  <h1>Friweika WorkTool — Prototype</h1>
</header>

<div class="container">

  <div class="card" id="translateCard">

    <label>Język źródłowy (source):</label>
    <select id="langFrom">
      <option value="pl">Polski</option>
      <option value="de">Niemiecki</option>
      <option value="en">Angielski</option>
    </select>

    <label>Język docelowy (target):</label>
    <select id="langTo">
      <option value="de">Niemiecki</option>
      <option value="pl">Polski</option>
      <option value="en">Angielski</option>
    </select>

    <label>Tekst do tłumaczenia:</label>
    <textarea id="sourceText" placeholder="Wpisz tekst..."></textarea>

    <div class="controls">
      <button class="btn btn-primary" id="translateBtn">Tłumacz</button>
      <button class="btn btn-ghost" id="googleBtn">🌐</button>
      <button class="btn btn-ghost" id="micBtn">🎤</button>
      <button class="btn btn-ghost" id="imgBtn">📷</button>
    </div>

    <label style="margin-top:14px;">Tłumaczenie:</label>
    <textarea id="translatedText" readonly></textarea>
    <div class="small" id="debugNote"></div>

  </div>

  <div style="height:14px"></div>

  <div class="card" id="historyCard">
    <h3>Historia tłumaczeń + analiza</h3>
    <div class="legend">
      <div class="legend-row"><div class="color-box" style="background:var(--det-der)"></div> der (rodzajnik)</div>
      <div class="legend-row"><div class="color-box" style="background:var(--det-die)"></div> die (rodzajnik)</div>
      <div class="legend-row"><div class="color-box" style="background:var(--det-das)"></div> das (rodzajnik)</div>
      <div class="legend-row"><div class="color-box" style="background:var(--noun)"></div> Rzeczownik</div>
      <div class="legend-row"><div class="color-box" style="background:var(--verb)"></div> Czasownik</div>
      <div class="legend-row"><div class="color-box" style="background:var(--adj)"></div> Przymiotnik</div>
      <div class="legend-row"><div class="color-box" style="background:var(--adv)"></div> Przysłówek</div>
      <div class="legend-row"><div class="color-box" style="background:var(--prep)"></div> Przyimek</div>
    </div>

    <div id="historyList" style="margin-top:14px"></div>
  </div>

  <div style="height:80px"></div>

</div>

<div class="footer">
  <img src="assets/friweika-logo.png" />
  <div class="note">Wersja testowa Friweika — Prototype</div>
</div>

<div class="nav">
  <div class="item active" data-tab="translate">💬 Tłumacz</div>
  <div class="item" data-tab="history">🕘 Historia</div>
  <div class="item" data-tab="learn">🧠 Nauka</div>
</div>

<script>
/* ======== NAWIGACJA ======== */
const tabBtns=document.querySelectorAll('.nav .item');
const translateCard=document.getElementById('translateCard');
