<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Friweika WorkTool — Prototype</title>
<style>
:root{--fri-yellow:#FBD345;--fri-red:#C52828;--fri-orange:#F76C1F;--fri-bg:#FFF7DA;--text-dark:#3A2A2A}
*{box-sizing:border-box}
body{margin:0;background:var(--fri-bg);font-family:Segoe UI, Roboto, Arial, sans-serif;color:var(--text-dark)}
header{background:var(--fri-red);padding:12px;display:flex;align-items:center;gap:12px}
header img{height:46px}
.container{max-width:900px;margin:18px auto;padding:16px}
.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.row{display:flex;gap:12px}
label{display:block;margin:.6rem 0;color:var(--fri-red);font-weight:700}
select,textarea,input{width:100%;padding:12px;border-radius:8px;border:1px solid #d9d9d9;font-size:15px}
textarea{min-height:110px}
.controls{display:flex;gap:12px;margin-top:14px}
.btn{padding:12px;border-radius:8px;border:none;cursor:pointer}
.btn-primary{background:var(--fri-red);color:#fff;font-weight:700}
.btn-ghost{background:#eee}
.result{margin-top:12px}
.result textarea{min-height:120px}
.nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:3px solid var(--fri-yellow);display:flex}
.nav .item{flex:1;text-align:center;padding:8px;color:#666;cursor:pointer}
.nav .item.active{color:var(--fri-red);font-weight:700}
.history-item{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}
.small{font-size:13px;color:#666;margin-top:8px}
.offline{display:none;background:#fff3f3;padding:10px;border-radius:8px;margin-bottom:10px;color:#700}
.parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{padding:6px 8px;border-radius:8px;font-size:13px}
.tag.n{background:#e6f7ff;color:#0050b3}
.tag.v{background:#fff0f6;color:#a8071a}
.tag.a{background:#f6ffed;color:#237804}
.footer-note{text-align:center;padding:12px;color:#666}
</style>
</head>
<body>
<header>
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Friweika-Logo.jpg/640px-Friweika-Logo.jpg" alt="Friweika logo">
  <h1 style="color:white;margin:0;font-size:20px">Friweika WorkTool — Prototype</h1>
</header>

<div class="container">
  <div class="card" id="translateCard">
    <div class="offline" id="offlineMsg">Brak połączenia — tłumaczenie online niedostępne.</div>

    <label>Język źródłowy (source):</label>
    <select id="langFrom">
      <option value="pl">Polski</option>
      <option value="de">Niemiecki</option>
      <option value="en">Angielski</option>
    </select>

    <label>Język docelowy (target):</label>
    <select id="langTo">
      <option value="de">Niemiecki</option>
      <option value="pl">Polski</option>
      <option value="en">Angielski</option>
    </select>

    <label>Tekst do tłumaczenia:</label>
    <textarea id="sourceText" placeholder="Wpisz tekst..."></textarea>

    <div class="controls">
      <button class="btn btn-primary" id="translateBtn">Tłumacz</button>
      <button class="btn btn-ghost" id="googleBtn">Otwórz Google Translate</button>
      <button class="btn btn-ghost" id="micBtn">🎤</button>
      <button class="btn btn-ghost" id="imgBtn">📷</button>
    </div>

    <div class="result">
      <label>Tłumaczenie:</label>
      <textarea id="translatedText" readonly placeholder="Tutaj pojawi się wynik..."></textarea>
      <div class="small" id="debugNote"></div>
    </div>

    <div style="margin-top:14px">
      <label>Analiza (części mowy — podświetlenie):</label>
      <div id="analysis" class="parts"></div>
    </div>

  </div>

  <div style="height:14px"></div>

  <div class="card" id="historyCard">
    <h3>Historia tłumaczeń</h3>
    <div id="historyList"></div>
  </div>

  <div style="height:120px"></div>
</div>

<div class="nav">
  <div class="item active" data-tab="translate">Tłumacz</div>
  <div class="item" data-tab="history">Historia</div>
  <div class="item" data-tab="learn">Nauka</div>
</div>

<div class="footer-note">Projekt testowy Friweika — prototype</div>

<script>
// ======= UI / NAV ======
const navItems = document.querySelectorAll('.nav .item');
const translateCard = document.getElementById('translateCard');
const historyCard = document.getElementById('historyCard');

navItems.forEach(it => it.addEventListener('click', ()=>{
  navItems.forEach(x=>x.classList.remove('active'));
  it.classList.add('active');
  const tab = it.dataset.tab;
  translateCard.style.display = tab==='translate' ? 'block' : 'none';
  historyCard.style.display = tab==='history' ? 'block' : 'none';
  if(tab==='history') renderHistory();
}));

// start state
translateCard.style.display='block'; historyCard.style.display='none';

// ======= Helpers ======
function setDebug(t){ document.getElementById('debugNote').textContent = t || ''; }

// strip surrounding quotes and extra whitespace
function cleanTranslation(s){
  if(!s) return s;
  s = s.trim();
  // remove excessive leading/trailing quotes (single or double repeated)
  while((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))){
    s = s.slice(1,-1).trim();
  }
  return s;
}

// ======= TRANSLATION ======
const translateBtn = document.getElementById('translateBtn');
const googleBtn = document.getElementById('googleBtn');
const micBtn = document.getElementById('micBtn');
const imgBtn = document.getElementById('imgBtn');

translateBtn.addEventListener('click', async ()=>{
  const q = document.getElementById('sourceText').value.trim();
  const source = document.getElementById('langFrom').value;
  const target = document.getElementById('langTo').value;
  const out = document.getElementById('translatedText');
  if(!q){ alert('Wpisz tekst.'); return; }

  out.value = 'Tłumaczę...'; setDebug('');
  try{
    const res = await fetch('/api/translate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ q, source, target })
    });

    const j = await res.json();
    if(j.ok && (j.translation || j.translatedText || j.result)){
      const raw = j.translation || j.translatedText || j.result;
      const cleaned = cleanTranslation(raw);
      out.value = cleaned;
      saveHistory(q, cleaned);
      // analiza części mowy (prosty parser / demo)
      renderAnalysis(cleaned);
    } else {
      out.value = 'Błąd tłumaczenia.';
      setDebug(JSON.stringify(j));
    }
  } catch(e){
    out.value = 'Błąd połączenia z serwerem.'; setDebug(e.message);
  }
});

googleBtn.addEventListener('click', ()=>{
  const txt = encodeURIComponent(document.getElementById('sourceText').value);
  window.open('https://translate.google.com/?sl=auto&tl='+document.getElementById('langTo').value+'&text='+txt+'&op=translate','_blank');
});

// ======= Microphone (Web Speech API fallback) ======
let recognition;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'pl-PL';
  recognition.interimResults = false;
  recognition.onresult = e => {
    const t = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('sourceText').value = t;
  };
  recognition.onerror = e => setDebug('Speech error: '+e.error);
}

micBtn.addEventListener('click', ()=>{
  if(!recognition){ alert('Mikrofon nie jest wspierany w tej przeglądarce.'); return; }
  try{ recognition.start(); }catch(e){ setDebug(e.message); }
});

// ======= Simple image-upload & OCR call placeholder ======
imgBtn.addEventListener('click', async ()=>{
  const f = document.createElement('input'); f.type='file'; f.accept='image/*';
  f.onchange = async ()=>{
    if(!f.files[0]) return;
    setDebug('Wysyłam obraz do OCR... (demo)');
    // tutaj możesz wywołać endpoint OCR lub usługę OCR. Na prototypie pokażemy tylko nazwę pliku
    const name = f.files[0].name;
    document.getElementById('sourceText').value = '[Zdjęcie: '+name+']';
    setDebug('OCR niezaimplementowany — dodaj backend do rozpoznawania tekstu.');
  };
  f.click();
});

// ======= HISTORY (localStorage) ======
function saveHistory(inText, outText){
  const list = JSON.parse(localStorage.getItem('fri_history')||'[]');
  list.unshift({inText, outText, date:new Date().toLocaleString()});
  localStorage.setItem('fri_history', JSON.stringify(list));
}

function renderHistory(){
  const list = JSON.parse(localStorage.getItem('fri_history')||'[]');
  const box = document.getElementById('historyList'); box.innerHTML='';
  if(list.length===0) box.innerHTML = '<p>Brak historii.</p>';
  list.forEach(it=>{
    const el = document.createElement('div'); el.className='history-item';
    el.innerHTML = `<div style="font-size:13px;color:#444;font-weight:700">${it.date}</div><div style="margin-top:6px"><b>Wejście:</b> ${escapeHtml(it.inText)}</div><div style="margin-top:6px"><b>Wyjście:</b> ${escapeHtml(it.outText)}</div>`;
    box.appendChild(el);
  });
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ======= SIMPLE PART-OF-SPEECH DEMO (very naive) ======
function renderAnalysis(text){
  const out = document.getElementById('analysis'); out.innerHTML='';
  if(!text) return;
  const words = text.split(/\s+/).filter(Boolean);
  words.forEach(w=>{
    const cls = detectPOS(w);
    const el = document.createElement('div'); el.className='tag '+cls; el.textContent = w; out.appendChild(el);
  });
}

function detectPOS(word){
  // super-prosty heurystyczny detektor (demo)
  const lw = word.toLowerCase();
  if(/[0-9]/.test(lw)) return 'tag.n'; // liczba
  if(lw.endsWith('ć') || lw.endsWith('ed') || lw.endsWith('en') || lw.endsWith('ing')) return 'tag.v';
  if(lw.endsWith('y') || lw.endsWith('a') || lw.endsWith('o') || lw.endsWith('e')) return 'tag.n';
  return 'tag.a';
}

// init: render small analysis from initial value
renderAnalysis('');

</script>
</body>
  </html>
